<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Projeto CSS</title>
    <link rel="stylesheet" href="styles/estilo.css">
</head>

<body>
    <header class="main-header">
        <h1 class="main-header__title">Cursos SerFrontend</h1>
        <p class="main-header__subtitle">Tudo o que precisa saber para iniciar na carreira</p>
    </header>
    
    <main class="content-bg">
        <ul class="cards">
            <li class="card-elements">
                <img src="imagens/card_01.png" class="card-elements__img" alt="Seletores">

            </li>

            <li class="card-elements">
                <img src="imagens/card_02.jpg" class="card-elements__img" alt="Posicionamento">

            <li class="card-elements">

            <li class="card-elements">

                <a href="#" class="card-elements__name">Flexbox</a>
            </li>

            <li class="card-elements">
                <img src="imagens/card_05.jpg" class="card-elements__img" alt="CSS Grid">
                <a href="#" class="card-elements__name">CSS Grid</a>
            </li>

            <li class="card-elements">
